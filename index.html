<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/src/assets/favicon/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Simplr headless WordPress scaffold with Vite, React, Tailwind, GSAP, structured data, and SEO-ready routing."
    />
    <meta name="theme-color" content="#f4efe7" />

    <meta name="robots" content="index,follow" />
    <title>Simplr</title>
    <script>history.scrollRestoration = 'manual'; window.scrollTo(0, 0);</script>
    <script>
      (function () {
        var path = window.location.pathname;
        if (path === '/' || path === '') {
          document.documentElement.setAttribute('data-home-intro-pending', 'true');
        }
      })();
    </script>
    <style>
      html[data-home-intro-pending='true'] .header,
      html[data-home-intro-pending='true'] .compact-logo,
      html[data-home-intro-pending='true'] .menu-icon,
      html[data-home-intro-pending='true'] #mobile-nav,
      html[data-home-intro-pending='true'] .landing .hero-video,
      html[data-home-intro-pending='true'] .landing .hero-video-holder,
      html[data-home-intro-pending='true'] .landing .hero-video-trigger,
      html[data-home-intro-pending='true'] .landing .play-icon,
      html[data-home-intro-pending='true'] .play-icon-mobile {
        visibility: hidden !important;
        pointer-events: none;
      }

      /* Critical FOUC guards: prerendered HTML paints before the CSS chunk.
         Logo SVG is 527×172 without these rules. */
      .logo-holder {
        max-width: 11rem;
      }
      .logo svg,
      .logo-holder svg {
        width: 100%;
        height: auto;
        display: block;
        max-width: 100%;
      }
      .compact-logo {
        opacity: 0;
        pointer-events: none;
      }
      .compact-logo svg {
        width: 100%;
        height: 44.75px;
        display: block;
      }
      @media (min-width: 768px) {
        .logo-holder { max-width: 22rem; }
        .compact-logo svg { height: 35.8px; }
      }
      @media (min-width: 1024px) {
        .logo-holder { max-width: 26rem; }
        .compact-logo svg { height: 44.75px; }
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        opacity: 1;
        visibility: visible;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .boot-dots {
        position: relative;
        width: 1.875rem;
        height: 1.875rem;
      }

      .boot-dot,
      .boot-dot-top,
      .boot-dot-mask {
        position: absolute;
        inset: 0;
        width: 1.875rem;
        height: 1.875rem;
        border-radius: 9999px;
      }

      .boot-dot-top { background: #000; z-index: 7; }
      .boot-dot-mask { background: #fff; z-index: 6; }

      .boot-dot {
        animation: boot-dot-slide 3s linear infinite;
        transform: translateX(0%);
      }

      .boot-dot-1 { background: #705f07; z-index: 5; animation-delay: 0s; }
      .boot-dot-2 { background: #d5e09e; z-index: 4; animation-delay: 0.6s; }
      .boot-dot-3 { background: #c8bbff; z-index: 3; animation-delay: 1.2s; }
      .boot-dot-4 { background: #f15941; z-index: 2; animation-delay: 1.8s; }
      .boot-dot-5 { background: #596bf0; z-index: 1; animation-delay: 2.4s; }

      @keyframes boot-dot-slide {
        0% { transform: translateX(0%); }
        13.333% { transform: translateX(50.5%); }
        16.666% { transform: translateX(50.5%); }
        30% { transform: translateX(0%); }
        100% { transform: translateX(0%); }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-dots">
        <span class="boot-dot-top"></span>
        <span class="boot-dot-mask"></span>
        <span class="boot-dot boot-dot-1"></span>
        <span class="boot-dot boot-dot-2"></span>
        <span class="boot-dot boot-dot-3"></span>
        <span class="boot-dot boot-dot-4"></span>
        <span class="boot-dot boot-dot-5"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
